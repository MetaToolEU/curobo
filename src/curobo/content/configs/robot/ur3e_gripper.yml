robot_cfg:
  kinematics:
    use_usd_kinematics: False
    isaac_usd_path: "usd/ur3e_gripper.usd"
    usd_robot_root: "/robot"
    usd_flip_joints: ["shoulder_pan_joint","shoulder_lift_joint","elbow_joint","wrist_1_joint", "wrist_2_joint",
      "wrist_3_joint","single_right_finger_joint","single_left_finger_joint"]
    usd_flip_joints: {
    "shoulder_pan_joint": "Z",
    "shoulder_lift_joint": "Z",
    "elbow_joint": "Z",
    "wrist_1_joint": "Z",
    "wrist_2_joint": "Z",
    "wrist_3_joint": "Z",
    "single_right_finger_joint": "y",
    "single_left_finger_joint": "Y",
    }

    urdf_path: "robot/ur_description/ur3e_1.urdf"
    asset_root_path: "robot/ur_description"
    base_link: "base_link"
    ee_link: "single_base"
    collision_link_names:
      [
        "shoulder_link",
        "upper_arm_link",
        "forearm_link",
        "wrist_1_link",
        "wrist_2_link",
        "wrist_3_link",
        "tool0",
        "single_base",
        "single_finger_right",
        "single_finger_left",
        "attached_object",
      ]
    collision_spheres: "spheres/ur3e.yml"
    collision_sphere_buffer: 0.0022
    extra_collision_spheres: {"attached_object": 2}
    use_global_cumul: True
    self_collision_ignore: {
      "upper_arm_link": ["shoulder_link","forearm_link"],
      "forearm_link": ["wrist_1_link"],
      "wrist_1_link": ["wrist_2_link","wrist_3_link"],
      "wrist_2_link": ["wrist_3_link","single_base" ,"tool0"],
      "wrist_3_link": ["tool0","single_base"],
      "single_base": ["single_finger_right","single_finger_left","attached_object"],
      "single_finger_right":["single_finger_left","attached_object"],
      "single_finger_left":["attached_object"],
      }





    self_collision_buffer: {
      "upper_arm_link": 0, 
      "forearm_link": 0, 
      "wrist_1_link": 0, 
      "wrist_2_link": 0,
      "wrist_3_link" : 0,
      "single_base" : 0,
      "single_finger_right": 0.01,
      "single_finger_left": 0.01,
      "attached_object": 0.0,
      } 
      
    # use_global_cumul: True
    mesh_link_names: null # List[str]
    extra_links: {"attached_object":{"parent_link_name": "single_base" ,
    "link_name": "attached_object", "fixed_transform": [0,0,0,1,0,0,0], "joint_type":"FIXED",
    "joint_name": "attach_joint" }}
    cspace:
      joint_names: ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint", "wrist_1_joint", "wrist_2_joint", "wrist_3_joint","single_right_finger_joint","single_left_finger_joint"]
      retract_config:  [-1.57, -2.2, 1.9, -1.383, -1.57, 0.0, -0.013 ,-0.013]
      null_space_weight:  [1, 1, 1, 1, 1, 1,1,1]
      cspace_distance_weight: [1, 1, 1, 1, 1, 1,1,1]
      max_acceleration: 15.0
      max_jerk: 500.0
